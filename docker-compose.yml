services:
  api:
    build: .
    restart: unless-stopped
    environment:
      HHPULSE_DB_PATH: /data/hhpulse.sqlite3
      HHPULSE_HOST: 0.0.0.0
      HHPULSE_PORT: 8080
      HHPULSE_QUARANTINE_DIR: /data/quarantine
      HHPULSE_PREFLIGHT_SUCCESSES: 3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hhpulse_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: ${HHPULSE_FRONTEND_DATA_MODE:-demo}
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"

volumes:
  hhpulse_data:
