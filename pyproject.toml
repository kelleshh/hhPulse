[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hhpulse"
version = "0.2.0"
description = "Local daily HH.ru labour-market analytics engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "hhPulse"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/hhpulse/infrastructure/hh/parser.py" = ["RUF001"]
"tests/infrastructure/test_hh_parser.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hhpulse"]
warn_unreachable = true
